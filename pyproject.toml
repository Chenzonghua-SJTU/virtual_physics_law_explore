[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shore-discovery-prototype"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "httpx>=0.27", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shore-agent = "shore_agent.cli:main"

[tool.setuptools]
py-modules = ["shore_worlds"]

[tool.setuptools.packages.find]
include = ["shore_agent*", "shore_sim*"]

[tool.setuptools.package-data]
shore_agent = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
